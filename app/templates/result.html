<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Your Ad Template</title>
		<link
			href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css"
			rel="stylesheet"
		/>
	</head>
	<body class="bg-gray-100">
		<div class="bg-black p-5 fixed top-0 left-0 w-full">
			<p class="text-white cursor-pointer">AD TEMPLATE</p>
		</div>
		<div class="flex flex-col justify-center items-center min-h-screen pt-16">
			<img
				src="data:image/jpeg;base64,{{ image_data }}"
				alt="Generated ad template"
				class="rounded-lg shadow-lg max-w-md"
			/>
			<div class="mt-6 flex gap-4">
				<a
					href="data:image/jpeg;base64,{{ image_data }}"
					download="ad_template.jpg"
					class="text-white bg-green-700 hover:bg-green-800 font-medium rounded-full text-sm px-5 py-2.5"
				>
					Download
				</a>
				<a
					href="/"
					class="text-gray-900 bg-gray-200 hover:bg-gray-300 font-medium rounded-full text-sm px-5 py-2.5"
				>
					Create Another
				</a>
			</div>
		</div>
	</body>
</html>
