<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Ad Template &mdash; Step 1</title>
		<link
			href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css"
			rel="stylesheet"
		/>
		<style>
			.form-label {
				margin-bottom: 0.5rem;
				font-size: 0.875rem;
				font-weight: 500;
				color: #374151;
			}
		</style>
	</head>
	<body class="bg-gray-100">
		<div class="bg-black p-5 fixed top-0 left-0 w-full">
			<p class="text-white cursor-pointer">AD TEMPLATE &mdash; Step 1: Stylize your product photo</p>
		</div>
		<div class="flex justify-center items-center min-h-screen">
			<form
				id="img2img-form"
				action="/getimg2img"
				method="post"
				enctype="multipart/form-data"
				class="max-w-lg mx-auto bg-white p-6 rounded-lg shadow"
			>
				<label for="img_file" class="form-label">PRODUCT PHOTO</label>
				<input
					type="file"
					name="image"
					accept="image/*"
					id="img_file"
					class="w-full text-sm text-gray-900 border border-gray-300 rounded-lg cursor-pointer bg-gray-50"
				/>
				<img id="preview" class="mt-3 rounded-lg max-h-48 hidden" alt="Preview" />

				<label for="prompt" class="form-label mt-4 block">PROMPT</label>
				<input
					type="text"
					id="prompt"
					name="prompt"
					placeholder="e.g. disney pixar style"
					class="w-full p-4 text-gray-900 border border-gray-300 rounded-lg bg-gray-50 sm:text-md"
				/>

				<label for="hex" class="form-label mt-4 block">BRAND HEX COLOR</label>
				<input
					type="text"
					id="hex"
					name="hex"
					placeholder="#000000"
					class="w-full p-4 text-gray-900 border border-gray-300 rounded-lg bg-gray-50 sm:text-md"
				/>

				<button
					id="submit-button"
					type="submit"
					class="text-white bg-green-700 hover:bg-green-800 font-medium rounded-full text-sm px-5 py-2.5 text-center mt-4 w-full"
				>
					Create new image from image
				</button>
				<p id="loading-text" class="text-sm text-gray-500 mt-2 text-center hidden">
					Generating&hellip; this can take a minute on CPU.
				</p>
			</form>
		</div>
		<script>
			document.getElementById('img_file').addEventListener('change', function (e) {
				const file = e.target.files[0];
				const preview = document.getElementById('preview');
				if (!file) {
					preview.classList.add('hidden');
					return;
				}
				const reader = new FileReader();
				reader.onload = (ev) => {
					preview.src = ev.target.result;
					preview.classList.remove('hidden');
				};
				reader.readAsDataURL(file);
			});

			document.getElementById('img2img-form').addEventListener('submit', function () {
				document.getElementById('submit-button').disabled = true;
				document.getElementById('submit-button').textContent = 'Generating...';
				document.getElementById('loading-text').classList.remove('hidden');
			});
		</script>
	</body>
</html>
